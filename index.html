const b2u=b=>{const s=atob(b);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u};
async function open_(pw,remember){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b2u(P.salt),iterations:P.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const z=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2u(P.iv)},key,b2u(P.ct));
  const html=await new Response(new Blob([z]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  try{remember?localStorage.setItem('mep-pw:'+P.salt,pw):0}catch(e){}
  document.open();document.write(html);document.close();
}
const f=document.getElementById('f'),e=document.getElementById('e'),b=document.getElementById('b');
f.addEventListener('submit',async ev=>{ev.preventDefault();b.disabled=true;e.textContent='';b.textContent='Đang mở…';
  try{await open_(document.getElementById('p').value,document.getElementById('r').checked)}
  catch(err){e.textContent='Sai mật khẩu. Hãy thử lại.';b.disabled=false;b.textContent='Mở'}});
try{const s=localStorage.getItem('mep-pw:'+P.salt);if(s){b.disabled=true;b.textContent='Đang mở…';open_(s,true).catch(()=>{localStorage.removeItem('mep-pw:'+P.salt);b.disabled=false;b.textContent='Mở'})}}catch(x){}
